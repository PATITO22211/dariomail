[package]
name = "dariomail"
version = "0.1.0"
edition = "2021"
description = "Backend JMAP de DarioMail"
publish = false

[dependencies]
ammonia = "4"
argon2 = "0.5"
axum = "0.7"
base64 = "0.22"
bytes = "1"
dotenvy = "0.15"
futures = "0.3"
getrandom = "0.2"
hmac = "0.12"
http-body-util = "0.1"
password-hash = "0.5"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
urlencoding = "2"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
