    <script>
      (function () {
        try {
          var saved = localStorage.getItem('dariomail-theme-v3');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
          } else {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
